name: Build Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Rust application
        shell: pwsh
        working-directory: rust-app/src-tauri
        run: cargo test --locked

      - name: Build Rust executable
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path rust-app/src-tauri/Cargo.toml --bin nba-live-scoreboard-rust
          $rustBinary = ".\rust-app\src-tauri\target\release\nba-live-scoreboard-rust.exe"
          if (-not (Test-Path $rustBinary)) {
            throw "Expected Rust executable was not created: $rustBinary"
          }
          Copy-Item -LiteralPath $rustBinary -Destination ".\nba-live-scoreboard.exe" -Force

      - name: Verify executable output
        shell: pwsh
        run: |
          if (-not (Test-Path ".\nba-live-scoreboard.exe")) {
            throw "Expected nba-live-scoreboard.exe was not created."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-live-scoreboard-windows
          path: nba-live-scoreboard.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NBA Live Scoreboard v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: nba-live-scoreboard.exe
          fail_on_unmatched_files: true
          overwrite_files: true
